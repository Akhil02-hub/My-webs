<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOVA Admin</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:1100px;margin:40px auto;padding:0 20px;background:#f7f7f2;color:#151714}
    h1{margin-bottom:6px}.hint{color:#6f746c}.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap} input,button,select{padding:10px;border:1px solid #ccc;border-radius:8px}button{cursor:pointer;background:#151714;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.card img{width:100%;height:180px;object-fit:cover;border-radius:10px}.stat{font-size:28px;font-weight:700}.muted{color:#6f746c;font-size:13px}.danger{background:#b33a30}
  </style>
</head>
<body>
  <h1>NOVA Admin</h1><p class="hint">Set your admin key, then manage products and review orders.</p>
  <div class="toolbar">
    <input id="key" type="password" placeholder="NOVA admin key" style="min-width:280px">
    <button onclick="loadProducts()">Products</button>
    <button onclick="loadOrders()">Orders</button>
    <button onclick="loadSubscribers()">Subscribers</button>
  </div>
  <div id="content"></div>
<script>
const content=document.getElementById('content');
const key=()=>document.getElementById('key').value;
async function adminFetch(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-Admin-Key':key(),...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d;}
async function loadProducts(){try{const data=await adminFetch('/api/admin/products');content.innerHTML=`<h2>Products (${data.length})</h2><div class="grid">${data.map(p=>`<div class="card"><img src="${p.image}"><h3>${p.name}</h3><div>${p.category} · $${Number(p.price).toFixed(2)}</div><p class="muted">Stock: ${p.stock} · Active: ${p.active}</p><button class="danger" onclick="archiveProduct(${p.id})">Archive</button></div>`).join('')}</div>`}catch(e){content.innerHTML=`<p>${e.message}</p>`}}
async function archiveProduct(id){if(!confirm('Archive this product?'))return;try{await adminFetch('/api/admin/products/'+id,{method:'DELETE'});loadProducts()}catch(e){alert(e.message)}}
async function loadOrders(){try{const data=await adminFetch('/api/admin/orders');content.innerHTML=`<h2>Orders (${data.length})</h2><div class="grid">${data.map(o=>`<div class="card"><div class="stat">#${o.id}</div><p>${o.customer_name||'Guest'} · ${o.email||'No email'}</p><p><b>$${Number(o.total).toFixed(2)}</b> · ${o.status}</p><select onchange="updateStatus(${o.id},this.value)"><option ${o.status==='pending'?'selected':''}>pending</option><option ${o.status==='confirmed'?'selected':''}>confirmed</option><option ${o.status==='shipped'?'selected':''}>shipped</option><option ${o.status==='delivered'?'selected':''}>delivered</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></div>`).join('')}</div>`}catch(e){content.innerHTML=`<p>${e.message}</p>`}}
async function updateStatus(id,status){try{await adminFetch('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})})}catch(e){alert(e.message)}}
async function loadSubscribers(){try{const data=await adminFetch('/api/admin/subscribers');content.innerHTML=`<h2>Subscribers (${data.length})</h2><div class="grid">${data.map(s=>`<div class="card"><b>${s.email}</b><p class="muted">${s.created_at}</p></div>`).join('')}</div>`}catch(e){content.innerHTML=`<p>${e.message}</p>`}}
</script>
</body>
</html>
